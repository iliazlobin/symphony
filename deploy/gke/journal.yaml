apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: symphony
  name: symphony-journal
  labels:
    app.kubernetes.io/name: symphony-controller
    app.kubernetes.io/part-of: symphony
spec:
  accessModes: [ReadWriteOncePod]
  # Reuse the platform-owned GKE PD CSI class; do not delete retained data on teardown.
  storageClassName: shared-retain
  resources:
    requests:
      storage: 10Gi
