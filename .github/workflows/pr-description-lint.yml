name: pr-description-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  validate-pr-description:
    runs-on: ${{ (vars.SYMPHONY_GKE_CI == 'enabled' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]')) && 'symphony-linux' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify private runner isolation
        if: runner.environment == 'self-hosted'
        working-directory: .
        run: python3 deploy/ci/probe_runner.py

      - name: Set up mise tools
        if: runner.environment == 'github-hosted'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Validate PR description format
        env:
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          printf '%s' "$PR_BODY_JSON" | jq -r '.' > "$RUNNER_TEMP/pr_body.md"
          mix pr_body.check --file "$RUNNER_TEMP/pr_body.md"
