apiVersion: v1
kind: ServiceAccount
metadata:
  name: symphony-controller
  labels:
    app.kubernetes.io/name: symphony-controller
    app.kubernetes.io/part-of: symphony
    symphony.openai.com/mode: bootstrap-paused
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symphony-controller
  labels:
    app.kubernetes.io/name: symphony-controller
    app.kubernetes.io/part-of: symphony
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: symphony-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: symphony-controller
        app.kubernetes.io/part-of: symphony
        symphony.openai.com/mode: bootstrap-paused
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: shared-dev
      serviceAccountName: symphony-controller
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Replace with the reviewed Artifact Registry digest before applying.
          image: us-west1-docker.pkg.dev/iz27-platform-dev/symphony/controller:REQUIRES_REVIEWED_DIGEST
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            exec:
              command: [python3, -I, /opt/symphony/entrypoint.py, check]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [python3, -I, /opt/symphony/entrypoint.py, check]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: journal
              mountPath: /var/lib/symphony
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: symphony-journal
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: symphony-controller
  labels:
    app.kubernetes.io/name: symphony-controller
    app.kubernetes.io/part-of: symphony
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: symphony-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
