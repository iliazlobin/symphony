githubConfigUrl: https://github.com/iliazlobin/symphony
githubConfigSecret: symphony-ci-github-app
runnerScaleSetName: symphony-linux
minRunners: 0
maxRunners: 1
controllerServiceAccount:
  namespace: symphony-ci-system
  name: symphony-ci-controller
listenerTemplate:
  metadata:
    labels:
      symphony-ci-role: listener
  spec:
    nodeSelector:
      node-restriction.kubernetes.io/workload: platform-ci-control
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
    - name: listener
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      env:
      - name: http_proxy
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
      - name: https_proxy
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
      - name: HTTP_PROXY
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
      - name: HTTPS_PROXY
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
      - name: no_proxy
        value: 10.48.0.1,10.40.0.2,.svc,.svc.cluster.local
      - name: NO_PROXY
        value: 10.48.0.1,10.40.0.2,.svc,.svc.cluster.local
    tolerations:
    - key: workload
      operator: Equal
      value: platform-ci-control
      effect: NoSchedule
template:
  metadata:
    labels:
      symphony-ci-role: runner
  spec:
    serviceAccountName: symphony-ci-job
    automountServiceAccountToken: false
    runtimeClassName: gvisor
    restartPolicy: Never
    activeDeadlineSeconds: 3600
    terminationGracePeriodSeconds: 30
    nodeSelector:
      node-restriction.kubernetes.io/workload: platform-ci
    tolerations:
    - key: workload
      operator: Equal
      value: platform-ci
      effect: NoSchedule
    - key: sandbox.gke.io/runtime
      operator: Equal
      value: gvisor
      effect: NoSchedule
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    initContainers:
    - name: initialize-runner
      image: REQUIRES_REVIEWED_CI_IMAGE_DIGEST
      command:
      - /bin/sh
      - -ec
      - cp -R /home/runner/. /runner-home/
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 6Gi
        limits:
          cpu: '1'
          memory: 512Mi
          ephemeral-storage: 10Gi
      volumeMounts:
      - name: runner-home
        mountPath: /runner-home
    containers:
    - name: runner
      image: REQUIRES_REVIEWED_CI_IMAGE_DIGEST
      command:
      - /usr/bin/tini
      - --
      - /home/runner/run.sh
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: '2'
          memory: 6Gi
          ephemeral-storage: 6Gi
        limits:
          cpu: '3'
          memory: 10Gi
          ephemeral-storage: 10Gi
      volumeMounts:
      - name: runner-home
        mountPath: /home/runner
      - name: temporary
        mountPath: /tmp
      env:
      - name: http_proxy
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
      - name: https_proxy
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
      - name: HTTP_PROXY
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
      - name: HTTPS_PROXY
        value: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
    volumes:
    - name: runner-home
      emptyDir:
        sizeLimit: 8Gi
    - name: temporary
      emptyDir:
        sizeLimit: 2Gi
proxy:
  http:
    url: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
  https:
    url: http://symphony-ci-proxy.symphony-ci-system.svc.cluster.local:3128
  noProxy:
  - 10.48.0.1
  - 10.40.0.2
  - .svc
  - .svc.cluster.local
